name = "rainbow-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 金鑰不放這裡。用：
#   wrangler secret put RAINBOW_KEY      （Rainbow API 金鑰）
#   wrangler secret put GH_DISPATCH_TOKEN （GitHub fine-grained PAT，Actions: read+write，只給這個 repo）
# 本機測試放 worker/.dev.vars（已 gitignore）：  RAINBOW_KEY=xxxx / GH_DISPATCH_TOKEN=xxxx

# 每 12 分鐘戳 GitHub Actions 跑 fetch-cwa.yml。
# GitHub 對 */15 排程狂降速（實測每 3–5 小時才跑一次），不能靠它做即時工具。
[triggers]
crons = ["*/12 * * * *"]

[observability]
enabled = true
