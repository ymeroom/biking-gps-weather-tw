<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>單車 GPS 降水地圖（台灣）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  :root{
    --panel-bg: rgba(255,255,255,.94);
    --panel-fg: #16202e;
    --panel-sub: #5b6b7f;
    --accent: #1d6fe0;
    --border: #d5dde8;
    --btn-bg: #f0f4f9;
  }
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
    background:#0b1220;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  #map{position:fixed;inset:0;z-index:0;background:#0b1220}

  #top-bar{position:fixed;top:0;left:0;right:0;z-index:1200;display:flex;gap:8px;flex-wrap:wrap;
    padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;font-size:12px;color:#eaf0f8;
    background:linear-gradient(#0b1220ee,#0b122000);pointer-events:none}
  #top-bar .chip{background:#0b1220cc;border:1px solid #ffffff22;border-radius:999px;padding:3px 9px;white-space:nowrap}
  #top-bar .chip b{color:#8fc0ff}

  #panel{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:var(--panel-bg);color:var(--panel-fg);
    border-top:1px solid var(--border);border-radius:16px 16px 0 0;
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -6px 24px #0006}
  #hint{font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.5;color:var(--panel-sub)}
  #hint b{color:var(--panel-fg)}
  #hint .k{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin:0 3px 0 6px;border:1px solid #0003}
  #forecast{font-size:13px;line-height:1.6;margin-bottom:8px;padding:8px 10px;border-radius:9px;
    background:var(--btn-bg);border:1px solid var(--border)}
  #forecast[hidden]{display:none}
  #ghosthint{display:block;margin-top:4px;color:var(--panel-sub)}
  #ghosthint[hidden]{display:none}

  .tl-row{display:flex;align-items:center;gap:10px}
  #play{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--btn-bg);
    font-size:20px;cursor:pointer;color:var(--accent);font-weight:900}
  #slider{flex:1;height:34px}
  input[type=range]{accent-color:var(--accent)}
  #time-label{flex:0 0 auto;min-width:118px;text-align:right;font-size:13px;font-weight:800}
  #time-label small{display:block;font-weight:600;color:var(--panel-sub);font-size:11px}

  .ctl-row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .ctl-row button{flex:1 1 auto;min-width:70px;padding:8px 6px;border-radius:9px;border:1px solid var(--border);
    background:var(--btn-bg);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--panel-fg)}
  .ctl-row button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ctl-row button:disabled{opacity:.5;cursor:default}

  #legend{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 46px);z-index:1300;background:var(--panel-bg);color:var(--panel-fg);
    border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:11.5px;line-height:1.5;box-shadow:0 4px 16px #0004;
    max-height:calc(100vh - 130px);max-height:calc(100svh - 130px);overflow-y:auto;overscroll-behavior:contain}
  #legend h4{margin:0 0 6px;font-size:12px}
  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .sw{width:16px;height:12px;border-radius:2px;border:1px solid #0002}
  #legend[hidden]{display:none}

  #toast{position:fixed;left:50%;top:52px;transform:translateX(-50%);z-index:1500;
    background:#0b1220ee;color:#fff;border:1px solid #ffffff33;border-radius:10px;padding:9px 14px;font-size:13px;
    max-width:88vw;text-align:center;transition:opacity .3s;box-shadow:0 6px 20px #0007}
  #toast[hidden]{display:none}

  .me-dot{width:18px;height:18px;background:var(--accent);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0004}
  .me-head{position:absolute;left:50%;top:50%;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-bottom:16px solid var(--accent);transform-origin:50% 100%;margin:-20px 0 0 -7px;filter:drop-shadow(0 0 1px #fff)}
  .ghost-dot{width:13px;height:13px;background:#ff8f00cc;border:2px dashed #fff;border-radius:50%;box-shadow:0 0 0 1px #0005}
  .ghost-label{background:#ff8f00;color:#fff;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:5px;white-space:nowrap;
    transform:translate(9px,-7px);box-shadow:0 1px 4px #0005}
  .ghost-label-mini{padding:0 3px;font-size:9px;transform:translate(8px,-6px);opacity:.9}

  .leaflet-control-attribution{font-size:9px}
  body.dark-base .base-osm{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.4)}
  @media (prefers-color-scheme: dark){
    :root{--panel-bg:rgba(17,24,36,.95);--panel-fg:#e9eef5;--panel-sub:#93a2b5;--border:#2b3648;--btn-bg:#1c2636}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top-bar">
  <span class="chip" id="chip-gps">定位：<b>等待中…</b></span>
  <span class="chip" id="chip-cwa">雷達：<b>載入中…</b></span>
  <span class="chip" id="chip-spd" hidden>速度：<b>—</b></span>
  <span class="chip" id="chip-route" hidden>路線：<b>—</b></span>
</div>

<div id="toast" hidden></div>

<div id="legend" hidden>
  <h4 id="legend-title">雷達回波強度</h4>
  <div id="legend-route" hidden style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)"></div>
  <div id="legend-rows"></div>
  <div id="legend-src" style="margin-top:6px;color:var(--panel-sub)"></div>
</div>

<div id="panel">
  <div id="forecast" hidden></div>
  <div id="hint">
    <span class="k" style="background:#1d6fe0"></span>你的位置
    <span class="k" style="background:#ff8f00"></span>推算的前方位置。
    <b id="modehint">播放時間軸看雨帶往哪移動。</b>
    <span id="ghosthint" hidden>📴 手機還沒回報行進方向／速度（通常要持續移動幾秒），暫時不顯示前方推算點。</span>
  </div>
  <div class="tl-row">
    <button id="play" aria-label="播放">▶</button>
    <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="時間軸">
    <span id="time-label">—<small>—</small></span>
  </div>
  <div class="ctl-row">
    <button id="btn-follow" class="on">📍 跟隨</button>
    <button id="btn-now">⏱️ 回到最新</button>
    <button id="btn-wake">💡 螢幕常亮</button>
    <button id="btn-dark">🌙 深色底圖</button>
    <button id="btn-src">🌧️ 雷達源</button>
    <button id="btn-route">🚴 路線</button>
    <button id="btn-legend">🎨 圖例</button>
  </div>
</div>

<script>
"use strict";

/* ───────────────────────── 常數 ───────────────────────── */
/* 雷達：中央氣象署 O-A0058-003 整合回波圖，由 GitHub Actions 每 ~12 分抓一張、
   透明化、存進孤兒分支 data，這裡從 raw.githubusercontent.com 讀（有 CORS）。
   RainViewer 當 data 分支還沒建好 / 抓失敗時的後備。 */
const DATA_BASE = 'https://raw.githubusercontent.com/ymeroom/biking-gps-weather-tw/data/';
const RV_MANIFEST = 'https://api.rainviewer.com/public/weather-maps.json';
const RADAR_OPACITY = 0.62;
const RADAR_REFRESH_MS = 180000;   // 每 3 分重抓
const FORECAST_REFRESH_MS = 900000; // 每 15 分重抓鄉鎮預報（CWA 約 6 小時更新一次）
const GHOST_MINS = [10, 20, 30];   // 前方位置參考點（分鐘）
const RV_MAX_NATIVE_ZOOM = 7;
const QPF_MAX_AGE_MS = 2400000;    // 40 分：qpf 資料超過就算過期（跟 Android app 一致）
const QPF_REFRESH_MS = 600000;     // 每 10 分重抓 qpf.json（CWA 約 10–15 分更新）

/* CWA F-B0046「未來 1 小時雷達定量降雨預報」色階：[css色, mm 區間, 白話]
   **改這裡要同步改 scripts/fetch_cwa.py 的 QPF_SCALE**（PNG 是後端上色的）。 */
const QPF_SCALE = [
  ['rgb(120,200,255)', '<1',    '微量'],
  ['rgb(60,150,255)',  '1–4',   '小雨'],
  ['rgb(40,220,140)',  '4–10',  '中雨'],
  ['rgb(255,214,0)',   '10–20', '大雨'],
  ['rgb(255,140,0)',   '20–40', '豪雨'],
  ['rgb(225,0,0)',     '≥40',   '劇烈'],
];

/* QPF_SCALE 的數字下限/上限（mm），跟上面色階一一對應，路線上色用。 */
const QPF_BINS = [[0.1,1],[1,4],[4,10],[10,20],[20,40],[40,Infinity]];
const QPF_NO_RAIN_COLOR = '#2e9e4f';   // 路線上這一小段：未來1小時預報大致無雨
const QPF_NO_DATA_COLOR = '#9aa5b1';   // 路線上這一小段：預報資料過期／沒涵蓋，顏色僅供參考

/* 固定路線（GPX 錄製後端精簡出的座標檔，跟著網站一起發佈，不會自動更新）。 */
const ROUTES = [
  { key: 'challenge', file: 'routes/loop-challenge.json' },
  { key: 'easy',       file: 'routes/loop-easy.json' },
];

/* 中央氣象署 雷達回波 dBZ 標準色階（取自 colorbar_n.png）：[R,G,B, dBZ, 白話] */
const CWA_SCALE = [
  [  0, 200, 255, '≤15',  '毛毛雨'],
  [  0,  91, 255, '15–25', '小雨'],
  [  0, 200,   0, '25–35', '中雨'],
  [255, 255,   0, '35–40', '大雨'],
  [255, 152,   0, '40–45', '大雨→豪雨'],
  [255,   0,   0, '45–55', '豪雨'],
  [180,   0,   0, '55–60', '大豪雨'],
  [255,   0, 255, '≥60',  '劇烈'],
];

/* ───────────────────────── 狀態 ───────────────────────── */
const state = {
  pos: null,
  headingEMA: null,
  followMode: true,
  wakeWanted: true,
  frames: [],       // [{src, ms, label, isForecast, ...}] 由舊到新
  idx: 0,
  nowIdx: 0,        // 「現在」那一格
  playing: false,
  playTimer: null,
  refreshTimer: null,
  wakeLock: null,
};

/* ───────────────────────── 地圖 ───────────────────────── */
const map = L.map('map', {zoomControl:false, attributionControl:true}).setView([23.8, 121.0], 8);
L.control.zoom({position:'topright'}).addTo(map);
const BASE_OSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution:'&copy; OpenStreetMap', className: 'base-osm'
}).addTo(map);
let darkBase = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
function setDarkBase(on){
  darkBase = on;
  document.body.classList.toggle('dark-base', on);
  const b = document.getElementById('btn-dark');
  if(b) b.classList.toggle('on', on);
}

let radarLayer = null;
let meMarker = null, meAccCircle = null;
let ghostMarkers = [];

/* 固定路線圖層畫在自己的 pane，zIndex 比雷達圖層（400）高，才不會被蓋住。 */
map.createPane('routePane');
map.getPane('routePane').style.zIndex = 450;

map.on('dragstart', () => setFollow(false));

/* ───────────────────────── 小工具 ───────────────────────── */
function toast(msg, ms=3200){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false; t.style.opacity = '1';
  clearTimeout(toast._t);
  if(ms) toast._t = setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.hidden=true, 320); }, ms);
}
function pad(n){ return String(n).padStart(2,'0'); }
const TW_FMT = new Intl.DateTimeFormat('zh-TW', {timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit', hour12:false});
function twLabel(ms){ return TW_FMT.format(new Date(ms)); }

/* ───────────────────────── GPS 定位 ───────────────────────── */
function smoothHeading(deg){
  if(deg == null || isNaN(deg)) return state.headingEMA
    ? (Math.atan2(state.headingEMA.s, state.headingEMA.c) * 180/Math.PI + 360) % 360 : null;
  const r = deg * Math.PI/180, a = 0.4;
  if(!state.headingEMA){ state.headingEMA = {s:Math.sin(r), c:Math.cos(r)}; }
  else {
    state.headingEMA.s = a*Math.sin(r) + (1-a)*state.headingEMA.s;
    state.headingEMA.c = a*Math.cos(r) + (1-a)*state.headingEMA.c;
  }
  return (Math.atan2(state.headingEMA.s, state.headingEMA.c) * 180/Math.PI + 360) % 360;
}
function onPos(p){
  const c = p.coords;
  state.pos = {
    lat: c.latitude, lon: c.longitude, acc: c.accuracy,
    heading: smoothHeading(c.heading), speed: (c.speed != null && !isNaN(c.speed)) ? c.speed : null,
    ts: p.timestamp,
  };
  const ll = [c.latitude, c.longitude];
  if(!meMarker){
    meMarker = L.marker(ll, {icon: L.divIcon({className:'', html:'<div class="me-dot"></div><div class="me-head" id="me-head"></div>', iconSize:[18,18], iconAnchor:[9,9]}), zIndexOffset:1000}).addTo(map);
    meAccCircle = L.circle(ll, {radius:c.accuracy, color:'#1d6fe0', weight:1, opacity:.4, fillOpacity:.08}).addTo(map);
    map.setView(ll, 12);
  } else {
    meMarker.setLatLng(ll);
    meAccCircle.setLatLng(ll).setRadius(c.accuracy);
  }
  const head = document.getElementById('me-head');
  if(head) head.style.transform = state.pos.heading != null ? `rotate(${state.pos.heading}deg)` : 'scale(0)';
  if(state.followMode) map.panTo(ll, {animate:true, duration:.5});

  document.getElementById('chip-gps').innerHTML = '定位：<b>±' + Math.round(c.accuracy) + ' m</b>';
  const spdChip = document.getElementById('chip-spd');
  if(state.pos.speed != null){
    spdChip.hidden = false;
    spdChip.innerHTML = '速度：<b>' + (state.pos.speed*3.6).toFixed(1) + ' km/h</b>';
  } else spdChip.hidden = true;

  updateGhosts();
  renderForecast();
}
function onPosErr(e){
  const msg = e.code === 1 ? '定位權限被拒 —— 請到瀏覽器設定開啟此網站的定位權限'
            : e.code === 2 ? '目前收不到定位訊號（室內／隧道？）'
            : '定位逾時，重試中…';
  document.getElementById('chip-gps').innerHTML = '定位：<b style="color:#ff9a9a">失敗</b>';
  toast('⚠️ ' + msg, 5000);
}
function startGeo(){
  if(!('geolocation' in navigator)){ toast('此瀏覽器不支援定位'); return; }
  navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}

/* ───────────────────────── 前方位置幽靈點（不綁時間軸）───────────────────────── */
function destPoint(lat, lon, bearingDeg, distM){
  const R = 6371000, d = distM / R, br = bearingDeg * Math.PI/180;
  const la = lat*Math.PI/180, lo = lon*Math.PI/180;
  const la2 = Math.asin(Math.sin(la)*Math.cos(d) + Math.cos(la)*Math.sin(d)*Math.cos(br));
  const lo2 = lo + Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(la), Math.cos(d) - Math.sin(la)*Math.sin(la2));
  return [la2*180/Math.PI, ((lo2*180/Math.PI)+540)%360 - 180];
}
function clearGhosts(){ ghostMarkers.forEach(m => map.removeLayer(m)); ghostMarkers = []; }
function updateGhosts(){
  clearGhosts();
  const p = state.pos;
  const gh = document.getElementById('ghosthint');
  if(!p || p.speed == null || p.speed < 0.8 || p.heading == null){
    if(gh) gh.hidden = !p;   // 已定位但沒方向／速度 → 說明為何沒有前方點
    return;
  }
  if(gh) gh.hidden = true;
  GHOST_MINS.forEach((min, i) => {
    const dist = p.speed * min * 60;
    const [glat, glon] = destPoint(p.lat, p.lon, p.heading, dist);
    // 只有最遠那點掛完整標籤，其他只留小小的分鐘數 —— 手機窄螢幕、低 zoom 時三個 nowrap 標籤會疊在一起
    const last = i === GHOST_MINS.length - 1;
    const label = last
      ? '<div class="ghost-label">+' + min + '分 · ' + (dist/1000).toFixed(1) + ' km</div>'
      : '<div class="ghost-label ghost-label-mini">' + min + '</div>';
    const m = L.marker([glat, glon], {icon: L.divIcon({className:'', html:
      '<div class="ghost-dot"></div>' + label,
      iconSize:[13,13], iconAnchor:[7,7]}), zIndexOffset:900, interactive:false}).addTo(map);
    ghostMarkers.push(m);
  });
}

/* ───────────────────────── 雷達圖層（CWA 觀測 → RainViewer 後備；qpf = CWA 未來1h）───────────────────────── */
let radarMode = 'cwa';        // 'qpf' | 'cwa' | 'rv'（實際跑出來的）
/* 使用者手動偏好，按「雷達源」切換：null = CWA 觀測（自動退 RainViewer）、'qpf' = CWA 未來1h 預報。
   存 localStorage，重整／重開 App 也維持。 */
let userRadarPref = (() => { try{ return localStorage.getItem('radarPref') || null; }catch(_){ return null; } })();
let cwaBounds = [[20.5,118.0],[26.5,124.0]];
let rvHost = '';

/* ── CWA F-B0046 未來 1 小時降雨預報（qpf.json + qpf.png，data 分支）──
   qpf.json 同時給：地圖圖層（bounds + qpf.png）、面板點位查詢（ix/iy/mm + wgs84 origin）。
   跟雷達圖層分開抓，因為面板那行不管目前是哪個雷達源都要顯示。 */
let qpfMeta = null;               // {issued, fetched, bounds, wgs84Lat0, wgs84Lon0, res, nx, ny}
let qpfCells = null;              // Map(iy*nx+ix → mm)
async function loadQpf(){
  try{
    const bust = Math.floor(Date.now() / 60000);
    const d = await fetch(DATA_BASE + 'qpf.json?v=' + bust, {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    if(!d.bounds || d.wgs84Lat0 == null){ qpfMeta = null; qpfCells = null; return; }  // 舊格式/錯誤檔
    qpfMeta = {
      issuedMs: d.issued ? Date.parse(d.issued) : 0,
      fetchedMs: d.fetched ? Date.parse(d.fetched) : 0,
      bounds: d.bounds, lat0: d.wgs84Lat0, lon0: d.wgs84Lon0,
      res: d.res, nx: d.nx, ny: d.ny,
    };
    qpfCells = new Map();
    for(let k = 0; k < d.mm.length; k++) qpfCells.set(d.iy[k] * d.nx + d.ix[k], d.mm[k]);
    renderForecast();
    if(routeKey) renderRoute();                 // 路線顏色跟著新的一小時預報重算
    if(radarMode === 'qpf') loadRadarIndex();   // 圖層在用 qpf → 換新影格
  }catch(_){ /* 抓不到就維持舊的；qpfFresh() 會擋過期 */ }
}
function qpfFresh(){ return qpfMeta && qpfMeta.fetchedMs && (Date.now() - qpfMeta.fetchedMs) <= QPF_MAX_AGE_MS; }
/* 指定 WGS84 座標的未來 1 小時預報雨量（mm）。不在網格內回 null（未涵蓋），沒雨回 0。 */
function qpfMmAt(lat, lon){
  if(!qpfMeta || !qpfCells) return null;
  const ix = Math.round((lon - qpfMeta.lon0) / qpfMeta.res);
  const iy = Math.round((lat - qpfMeta.lat0) / qpfMeta.res);
  if(ix < 0 || ix >= qpfMeta.nx || iy < 0 || iy >= qpfMeta.ny) return null;
  return qpfCells.get(iy * qpfMeta.nx + ix) || 0;
}
/* 把 qpf.png 組成單張影格，套進雷達圖層。qpf 資料缺／過期回 false（呼叫端往下掉 CWA 觀測）。 */
async function useQpfLayer(){
  if(!qpfMeta) await loadQpf();
  if(!qpfMeta || !qpfFresh()) return false;
  radarMode = 'qpf';
  const ms = qpfMeta.issuedMs || qpfMeta.fetchedMs;
  const frame = {
    src:'qpf',
    url: DATA_BASE + 'qpf.png?v=' + Math.floor(Date.now() / 600000),
    bounds: qpfMeta.bounds, ms, label: twLabel(ms), isForecast:true,
  };
  adoptFrames([frame], '雷達：<b>CWA 未來1h</b> 預報', 0);
  return true;
}

/* ── 固定路線（環騎台北）：畫在地圖上，依 F-B0046 未來1小時預報幫每一小段上色 ──
   路線本身不會變（GPX 轉出來的靜態檔），只有顏色會跟著 qpf 資料每 10 分鐘重算。
   注意：整條路線都套用「現在」這一張未來1小時預報圖，不是你實際騎到那一段的天氣
   （免費雷達預報只準未來1小時，騎完全程要2–3小時的話，遠處路段只能當參考）。 */
let routeKey = (() => { try{ return localStorage.getItem('routeKey') || null; }catch(_){ return null; } })();
const routeCache = {};      // key -> {name, distanceKm, points}
let routeLayerGroup = null;

function haversineM(a, b){
  const R = 6371000, toRad = d => d * Math.PI/180;
  const dLat = toRad(b[0]-a[0]), dLon = toRad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function qpfColorForMm(mm){
  if(mm == null || !qpfFresh()) return QPF_NO_DATA_COLOR;
  if(mm < QPF_BINS[0][0]) return QPF_NO_RAIN_COLOR;
  for(let i = 0; i < QPF_BINS.length; i++){
    if(mm >= QPF_BINS[i][0] && mm < QPF_BINS[i][1]) return QPF_SCALE[i][0];
  }
  return QPF_SCALE[QPF_SCALE.length - 1][0];
}
async function loadRoute(key){
  if(routeCache[key]) return routeCache[key];
  const meta = ROUTES.find(r => r.key === key);
  if(!meta) return null;
  const d = await fetch(meta.file, {cache:'force-cache'}).then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status); return r.json();
  });
  routeCache[key] = d;
  return d;
}
function clearRouteLayer(){
  if(routeLayerGroup){ map.removeLayer(routeLayerGroup); routeLayerGroup = null; }
}
// 每隔約 500m 重新取樣一次顏色，相鄰同色的路段合併成一條線，避免畫出上千條小線段。
function renderRoute(){
  clearRouteLayer();
  const el = document.getElementById('chip-route');
  if(!routeKey){ el.hidden = true; return; }
  const data = routeCache[routeKey];
  if(!data || !data.points || data.points.length < 2){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '路線：<b>' + data.name + ' · ' + data.distanceKm + ' km</b>';

  const STEP_M = 500;
  const pts = data.points;
  const group = L.layerGroup();
  let segPts = [pts[0]];
  let color = qpfColorForMm(qpfMmAt(pts[0][0], pts[0][1]));
  let cumSinceSample = 0;
  const flush = (nextStartPt) => {
    if(segPts.length >= 2){
      L.polyline(segPts, {pane:'routePane', color:'#fff', weight:8, opacity:.55, lineCap:'round'}).addTo(group);
      L.polyline(segPts, {pane:'routePane', color, weight:4.5, opacity:.9, lineCap:'round'}).addTo(group);
    }
    segPts = nextStartPt ? [nextStartPt] : [];
  };
  for(let i = 1; i < pts.length; i++){
    cumSinceSample += haversineM(pts[i-1], pts[i]);
    segPts.push(pts[i]);
    if(cumSinceSample >= STEP_M){
      cumSinceSample = 0;
      const newColor = qpfColorForMm(qpfMmAt(pts[i][0], pts[i][1]));
      if(newColor !== color){
        flush(pts[i]);
        color = newColor;
      }
    }
  }
  flush(null);
  group.addTo(map);
  routeLayerGroup = group;
}
function cycleRoutePref(){
  const order = [null, ...ROUTES.map(r => r.key)];
  const next = order[(order.indexOf(routeKey) + 1) % order.length];
  setRoutePref(next);
}
async function setRoutePref(key){
  routeKey = key;
  try{ key ? localStorage.setItem('routeKey', key) : localStorage.removeItem('routeKey'); }catch(_){}
  reflectRouteBtn();
  if(!key){ clearRouteLayer(); document.getElementById('chip-route').hidden = true; renderLegend(); return; }
  try{
    const data = await loadRoute(key);
    renderRoute();
    renderLegend();
    if(data && data.points && data.points.length){
      map.fitBounds(L.latLngBounds(data.points), {padding:[24,24]});
    }
    toast('🚴 顯示「' + data.name + '」，顏色＝假設現在出發的未來1小時預報，不是精準預測你騎到那裡的天氣', 4500);
  }catch(e){
    toast('⚠️ 路線資料載入失敗：' + e.message, 4000);
    routeKey = null;
    try{ localStorage.removeItem('routeKey'); }catch(_){}
    reflectRouteBtn();
  }
}
function reflectRouteBtn(){
  const b = document.getElementById('btn-route');
  if(!b) return;
  const meta = ROUTES.find(r => r.key === routeKey);
  b.textContent = meta ? ('🚴 ' + (routeKey === 'challenge' ? '挑戰騎' : '輕鬆騎')) : '🚴 路線';
  b.classList.toggle('on', !!routeKey);
}

async function loadRadarIndex(){
  // 使用者選了 CWA 未來1h 預報：用 qpf 圖層；qpf 資料缺／過期就往下掉 CWA 觀測
  if(userRadarPref === 'qpf' && await useQpfLayer()) return;

  // CWA data 分支
  try{
    // raw.githubusercontent 有 ~5 分鐘 CDN 快取，用分鐘級 query 參數穿透
    const bust = Math.floor(Date.now() / 60000);
    const idx = await fetch(DATA_BASE + 'radar/index.json?v=' + bust, {cache:'no-store'}).then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    });
    if(!idx.frames || !idx.frames.length) throw new Error('無影格');
    cwaBounds = idx.bounds || cwaBounds;
    radarMode = 'cwa';
    const frames = idx.frames
      .map(o => ({ src:'cwa', url: DATA_BASE + 'radar/' + o.file, ms: o.ms, label: twLabel(o.ms), isForecast:false }))
      .sort((a,b) => a.ms - b.ms);
    adoptFrames(frames, '雷達：<b>' + frames[frames.length-1].label + '</b> CWA觀測');
    return;
  }catch(cwaErr){
    // 後備：RainViewer
    try{
      const data = await fetch(RV_MANIFEST, {cache:'no-store'}).then(r => r.json());
      rvHost = data.host;
      radarMode = 'rv';
      const frames = (data.radar && data.radar.past || [])
        .map(o => ({ src:'rv', path: o.path, ms: o.time * 1000, label: twLabel(o.time * 1000), isForecast:false }))
        .sort((a,b) => a.ms - b.ms);
      if(!frames.length) throw new Error('RainViewer 無影格');
      adoptFrames(frames, '雷達：<b>' + frames[frames.length-1].label + '</b> RainViewer後備');
    }catch(rvErr){
      document.getElementById('chip-cwa').innerHTML = '雷達：<b style="color:#ff9a9a">失敗</b>';
      reflectSrcBtn();
      toast('⚠️ 取不到雷達資料。CWA：' + cwaErr.message + '；RainViewer：' + rvErr.message, 6000);
    }
  }
}
function adoptFrames(frames, chipHtml, nowIdx){
  const atNow = !state.frames.length || state.idx === state.nowIdx;
  const prevMs = state.frames[state.idx] ? state.frames[state.idx].ms : null;
  state.frames = frames;
  state.nowIdx = (nowIdx == null) ? frames.length - 1 : Math.max(0, Math.min(frames.length - 1, nowIdx));
  let target = state.nowIdx;
  if(!atNow && prevMs != null){
    let g = Infinity;
    frames.forEach((f,i) => { const d = Math.abs(f.ms - prevMs); if(d < g){ g = d; target = i; } });
  }
  const single = frames.length < 2;   // qpf 只有單張 → 時間軸沒意義
  const slider = document.getElementById('slider');
  slider.max = Math.max(0, frames.length - 1);
  slider.disabled = single;
  const playBtn = document.getElementById('play');
  playBtn.disabled = single;
  if(single && state.playing) togglePlay();
  document.getElementById('chip-cwa').innerHTML = chipHtml ||
    ('雷達：<b>' + frames[frames.length-1].label + ' 更新</b>');
  if(typeof renderLegend === 'function') renderLegend();
  reflectHint();
  reflectSrcBtn();
  showFrame(target);
}
function showFrame(i){
  if(!state.frames.length) return;
  state.idx = Math.max(0, Math.min(state.frames.length-1, i));
  document.getElementById('slider').value = state.idx;
  const f = state.frames[state.idx];

  const prev = radarLayer;
  if(f.src === 'cwa'){
    radarLayer = L.imageOverlay(f.url, cwaBounds, {opacity: RADAR_OPACITY, zIndex: 400, interactive: false});
  } else if(f.src === 'qpf'){
    radarLayer = L.imageOverlay(f.url, f.bounds, {opacity: RADAR_OPACITY, zIndex: 400, interactive: false});
  } else {
    radarLayer = L.tileLayer(rvHost + f.path + '/256/{z}/{x}/{y}/4/1_1.png', {
      opacity: RADAR_OPACITY, zIndex: 400, maxNativeZoom: RV_MAX_NATIVE_ZOOM, maxZoom: 19,
    });
  }
  radarLayer.addTo(map);
  const dropPrev = () => { if(prev && prev !== radarLayer && map.hasLayer(prev)) map.removeLayer(prev); };
  if(state.playing){
    dropPrev();               // 播放時立刻換掉舊圖層 —— 慢網路下寧可短暫空白也別讓多層疊在一起糊成一團
  }else{
    radarLayer.once('load', dropPrev);
    setTimeout(dropPrev, 2500);
  }

  if(f.src === 'qpf'){
    document.getElementById('time-label').innerHTML =
      '未來1小時<small>CWA 預報 · ' + f.label + ' 發布</small>';
    return;
  }
  const dMin = Math.round((f.ms - Date.now()) / 60000);
  const ago = Math.max(0, -dMin);
  const tag = (ago <= 2 ? '現在' : ago + ' 分前') + ' · 觀測';
  document.getElementById('time-label').innerHTML = f.label + '<small>' + tag + '</small>';
}

/* ───────────────────────── 前方鄉鎮降雨預報面板 ───────────────────────── */
let forecastData = null;
let forecastUpdatedMs = 0;
async function loadForecast(){
  try{
    const fc = await fetch(DATA_BASE + 'forecast.json?v=' + Math.floor(Date.now()/600000), {cache:'no-store'}).then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    });
    forecastData = fc.counties || [];
    forecastUpdatedMs = fc.updated ? Date.parse(fc.updated) : 0;
    renderForecast();
  }catch(_){ /* data 分支還沒建好就先空著 */ }
}

function nearestCounty(lat, lon){
  if(!forecastData || !forecastData.length) return null;
  let best = null, bd = Infinity;
  for(const c of forecastData){
    const d = (c.lat-lat)**2 + (c.lon-lon)**2;
    if(d < bd){ bd = d; best = c; }
  }
  return best;
}
function slotNow(c){
  if(!c || !c.slots) return null;
  const now = Date.now();
  return c.slots.find(s => Date.parse(s.e) > now) || null;  // 全部過期 → null（不拿舊格假裝是現在）
}
function fmtAge(ms){
  if(!ms) return '';
  const mins = Math.round((Date.now() - ms) / 60000);
  if(mins < 90) return mins + ' 分前';
  return Math.round(mins / 60) + ' 小時前';
}
function popTone(pop){
  const n = +pop;
  return n >= 70 ? '#c62828' : n >= 40 ? '#e07a00' : n >= 20 ? '#5b6b7f' : '#1b7a37';
}
function renderForecast(){
  const el = document.getElementById('forecast');
  if(!state.pos){ el.hidden = true; return; }
  const parts = [];

  // CWA F-B0046 未來 1 小時預報（此處點位）—— 現在是這一行的主要資訊來源
  const qmm = qpfFresh() ? qpfMmAt(state.pos.lat, state.pos.lon) : null;
  if(qmm != null){
    const word = qmm < 0.5 ? '無雨' : qmm < 4 ? '小雨' : qmm < 10 ? '中雨' : qmm < 20 ? '大雨' : '豪雨';
    const txt = qmm < 0.5 ? '此處未來 1 小時 <b>大致無雨</b>'
      : '此處未來 1 小時 累積約 <b>' + qmm + ' mm</b>（' + word + '）';
    parts.push('<div style="font-weight:700">📡 ' + txt + '</div>');
  }

  if(forecastData && forecastData.length){
    const here = nearestCounty(state.pos.lat, state.pos.lon);
    if(here){
      const s = slotNow(here);
      if(s){
        let line = here.name + ' ' + (s.wx || '') +
          ' ｜ 降雨機率 <b style="color:' + popTone(s.pop) + '">' + (s.pop==null?'—':s.pop+'%') + '</b>' +
          ' <span style="color:var(--panel-sub);font-size:11px">(' + s.s.slice(11,16) + '–' + s.e.slice(11,16) + ' 縣市預報)</span>';
        if(state.pos.speed != null && state.pos.speed >= 0.8 && state.pos.heading != null){
          const d = state.pos.speed * 30 * 60;
          const [flat, flon] = destPoint(state.pos.lat, state.pos.lon, state.pos.heading, d);
          const ahead = nearestCounty(flat, flon);
          if(ahead && ahead.name !== here.name){
            const as = slotNow(ahead);
            if(as) line += '<br><span style="color:var(--panel-sub)">前方 ' + ahead.name + '</span> ' + (as.wx||'') +
              ' ｜ <b style="color:' + popTone(as.pop) + '">' + (as.pop==null?'—':as.pop+'%') + '</b>';
          }
        }
        parts.push('<div style="font-size:12.5px;margin-top:' + (qmm != null ? '3px' : '0') + '">' + line + '</div>');
      } else if(qmm == null){
        parts.push('<div style="font-size:12px;color:var(--warn)">⚠️ 縣市降雨預報資料過期（最後更新 ' +
          (fmtAge(forecastUpdatedMs) || '未知') + '）</div>');
      }
    }
  }

  if(!parts.length){ el.hidden = true; return; }
  el.innerHTML = parts.join('');
  el.hidden = false;
}

/* ───────────────────────── 播放 / 控制 ───────────────────────── */
function setFollow(on){
  state.followMode = on;
  document.getElementById('btn-follow').classList.toggle('on', on);
  if(on && state.pos) map.panTo([state.pos.lat, state.pos.lon]);
}
function togglePlay(){
  state.playing = !state.playing;
  document.getElementById('play').textContent = state.playing ? '⏸' : '▶';
  clearInterval(state.playTimer);
  if(state.playing){
    state.playTimer = setInterval(() => {
      let n = state.idx + 1;
      if(n >= state.frames.length) n = 0;
      showFrame(n);
    }, 700);
  }
}
const WAKE_SUPPORTED = ('wakeLock' in navigator);
function reflectWakeBtn(){
  const b = document.getElementById('btn-wake');
  if(!WAKE_SUPPORTED){
    b.disabled = true; b.textContent = '💡 常亮(不支援)';
    b.title = '此瀏覽器（例如 iOS Safari）沒有螢幕常亮 API，請到系統設定把自動鎖定關掉或調長';
    return;
  }
  b.classList.toggle('on', !!state.wakeLock);
  b.textContent = state.wakeLock ? '💡 螢幕常亮' : (state.wakeWanted ? '💡 常亮(重試中)' : '💡 螢幕常亮');
}
async function requestWake(){
  if(!WAKE_SUPPORTED || !state.wakeWanted || state.wakeLock){ reflectWakeBtn(); return; }
  try{
    state.wakeLock = await navigator.wakeLock.request('screen');
    state.wakeLock.addEventListener('release', () => { state.wakeLock = null; reflectWakeBtn(); });
  }catch(_){ state.wakeLock = null; }
  reflectWakeBtn();
}
function toggleWake(){
  if(!WAKE_SUPPORTED) return;
  state.wakeWanted = !state.wakeWanted;
  if(state.wakeWanted) requestWake();
  else if(state.wakeLock){ state.wakeLock.release(); state.wakeLock = null; }
  reflectWakeBtn();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state.wakeWanted && !state.wakeLock) requestWake();
});

/* 圖例（依目前雷達來源切換）*/
function reflectHint(){
  const el = document.getElementById('modehint');
  if(!el) return;
  el.textContent = radarMode === 'qpf'
    ? '地圖是未來 1 小時的總雨量預報（中央氣象署官方雷達）。單張圖、不能播放。'
    : '播放時間軸看過去雨帶往哪移動。台灣此模式沒有未來雷達，只有觀測＋上方降雨機率。';
}
function reflectSrcBtn(){
  const b = document.getElementById('btn-src');
  if(!b) return;
  b.textContent = radarMode === 'qpf' ? '🌧️ CWA 未來1h'
    : radarMode === 'rv' ? '📡 RainViewer' : '📡 CWA 觀測';
  b.classList.toggle('on', !!userRadarPref);   // 手動鎖 CWA 未來1h 時高亮
}
/* 雷達源切換：CWA 觀測（自動退 RainViewer） ↔ CWA 未來1h */
function cycleRadarPref(){
  setRadarPref(userRadarPref === null ? 'qpf' : null);
}
function setRadarPref(pref){
  userRadarPref = pref;
  try{ pref ? localStorage.setItem('radarPref', pref) : localStorage.removeItem('radarPref'); }catch(_){}
  toast(pref === 'qpf' ? '雷達切到 CWA 未來 1 小時降雨預報（單張圖）'
      : '雷達切到 CWA 觀測（10 分更新，無未來預報）', 2600);
  loadRadarIndex();
}
function renderLegend(){
  const rlEl = document.getElementById('legend-route');
  if(routeKey){
    rlEl.hidden = false;
    rlEl.innerHTML = '<h4 style="margin:0 0 6px">路線顏色（未來1小時預報）</h4>' +
      '<div class="row"><span class="sw" style="background:' + QPF_NO_RAIN_COLOR + '"></span>大致無雨</div>' +
      QPF_SCALE.map(r => `<div class="row"><span class="sw" style="background:${r[0]}"></span>${r[1]} mm · ${r[2]}</div>`).join('') +
      '<div class="row"><span class="sw" style="background:' + QPF_NO_DATA_COLOR + '"></span>資料過期／僅供參考</div>';
  } else {
    rlEl.hidden = true;
  }
  const t = document.getElementById('legend-title');
  const rows = document.getElementById('legend-rows');
  if(radarMode === 'qpf'){
    t.textContent = '未來 1 小時雨量預報（CWA）';
    rows.innerHTML = QPF_SCALE.map(r =>
      `<div class="row"><span class="sw" style="background:${r[0]}"></span>${r[1]} mm · ${r[2]}</div>`).join('');
    document.getElementById('legend-src').textContent =
      '資料：中央氣象署 F-B0046 定量降水預報（未來 1 小時累積）。空白＝預報無雨或雷達未涵蓋。';
    return;
  }
  t.textContent = '雷達回波強度';
  rows.innerHTML = CWA_SCALE.map(r => `<div class="row"><span class="sw" style="background:rgb(${r[0]},${r[1]},${r[2]})"></span>${r[3]} dBZ · ${r[4]}</div>`).join('');
  document.getElementById('legend-src').textContent =
    radarMode === 'rv' ? '資料：RainViewer（觀測，後備源）' : '資料：中央氣象署 整合雷達回波圖（觀測）';
}
renderLegend();

/* 綁定 */
document.getElementById('play').onclick = togglePlay;
document.getElementById('slider').oninput = e => { if(state.playing) togglePlay(); showFrame(+e.target.value); };
document.getElementById('btn-follow').onclick = () => setFollow(!state.followMode);
document.getElementById('btn-now').onclick = () => {
  if(state.playing) togglePlay();
  showFrame(state.nowIdx);
  if(state.pos) setFollow(true);
};
document.getElementById('btn-wake').onclick = toggleWake;
document.getElementById('btn-dark').onclick = () => setDarkBase(!darkBase);
document.getElementById('btn-src').onclick = cycleRadarPref;
document.getElementById('btn-route').onclick = cycleRoutePref;
document.getElementById('btn-legend').onclick = () => {
  const l = document.getElementById('legend'); l.hidden = !l.hidden;
  document.getElementById('btn-legend').classList.toggle('on', !l.hidden);
};

/* ───────────────────────── 啟動 ───────────────────────── */
setDarkBase(darkBase);
reflectWakeBtn();
reflectSrcBtn();
reflectRouteBtn();
startGeo();
loadQpf();
loadRadarIndex();
loadForecast();
if(routeKey){
  loadRoute(routeKey).then(() => { renderRoute(); renderLegend(); }).catch(() => {
    routeKey = null; try{ localStorage.removeItem('routeKey'); }catch(_){} reflectRouteBtn();
  });
}
requestWake();
setInterval(loadRadarIndex, RADAR_REFRESH_MS);
setInterval(loadForecast, FORECAST_REFRESH_MS);
setInterval(loadQpf, QPF_REFRESH_MS);
</script>
